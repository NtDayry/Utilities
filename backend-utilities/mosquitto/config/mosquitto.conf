# Mosquitto ของ Utilities stack
# การยืนยันตัวตน (passwd) และ bridge ไป broker เดิม สร้างจาก .env ทุกครั้งที่เริ่ม container
# → /mosquitto/data/generated/*.conf (ดู mosquitto/docker-entrypoint.sh)

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

# MQTT (TCP) — อุปกรณ์ / คอนโทรลเลอร์ / backend
listener 1883
protocol mqtt

# MQTT over WebSocket — หน้าเว็บ (ผ่าน nginx /mqtt)
listener 9001
protocol websockets

include_dir /mosquitto/data/generated
